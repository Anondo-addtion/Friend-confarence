<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected Encrypted Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #eef2f5; }
    /* পাসওয়ার্ড দেওয়ার আগে চ্যাট বক্স সম্পূর্ণ হাইড থাকবে */
    .chat-card { max-width: 450px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: none; }
    #chatWindow { height: 380px; border: 1px solid #ddd; background: #fafafa; overflow-y: auto; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    .controls { display: flex; flex-direction: column; gap: 8px; }
    .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 9px 12px; background: #0084ff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0066cc; }
    button.recording { background: #d9534f; animation: pulse 1s infinite; }
    .chat-img { max-width: 200px; border-radius: 8px; margin-top: 5px; display: block; }
    .role-badge { font-size: 12px; padding: 3px 6px; background: #28a745; color: white; border-radius: 4px; float: right; }
    audio { margin-top: 5px; max-width: 240px; }
    @keyframes pulse { 50% { opacity: 0.6; } }
  </style>
</head>
<body>

<div class="chat-card" id="chatCard">
  <h2>🔒 Private Chatroom <span id="roleBadge" class="role-badge" style="display:none;">Host</span></h2>
  <div id="chatWindow"></div>

  <div class="controls">
    <div style="display: flex; gap: 5px;">
      <input type="text" id="messageInput" placeholder="মেসেজ লিখুন...">
      <button id="sendBtn">Send</button>
    </div>
    
    <div class="btn-group">
      <input type="file" id="imageInput" accept="image/*" style="display:none;">
      <input type="file" id="fileInput" style="display:none;">

      <button onclick="document.getElementById('imageInput').click()">📷 Photo</button>
      <button onclick="document.getElementById('fileInput').click()">📁 File</button>
      <button id="voiceBtn">🎙️ Voice</button>
      <button id="locationBtn">📍 Location</button>
    </div>
  </div>
</div>
<script src = "script.js">  </script>
</body>
</html>
